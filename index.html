<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mansur — start up qilaylik ! · 20 yillik bekorchi !</title>
  <meta name="description" content="Mansur — start up qilaylik ! · 20 yillik bekorchi ! · whats up bro ! · Qandaysiz bratim !">
  <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg">
  
  <!-- Fonts: Caveat (authentic cursive/handwriting) & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/mansur.css?v=6">
</head>
<body>

  <!-- Ambient Dot Grid Background -->
  <div class="ambient-grid" aria-hidden="true"></div>

  <!-- Single Centered Showcase -->
  <main class="page-container">
    <div class="stage-wrapper">
      
      <!-- Left Bubble: "whats up bro !" -->
      <div class="speech-box bubble-left" id="bubbleWhatsUp" role="button" tabindex="0" title="whats up bro !">
        <span class="speech-text">whats up bro !</span>
      </div>

      <!-- Center Column: Top text + Head + Bottom text -->
      <div class="center-column">
        
        <!-- Yuqorida: "start up qilaylik !" -->
        <div class="speech-box bubble-top" id="bubbleStartup" role="button" tabindex="0" title="start up qilaylik !">
          <span class="speech-text">start up qilaylik !</span>
        </div>

        <!-- Odiy Kallani O'zi (Razor-Sharp, No Frame) -->
        <div class="mansur-head-standalone" id="mansurHead" role="button" tabindex="0" title="Mansur">
          <img src="img/avatar-mansur-clean.png" alt="Mansur" id="mansurImg" class="mansur-head-img" draggable="false">
        </div>

        <!-- Pastida: "20 yillik bekorchi !" -->
        <div class="speech-box bubble-bottom" id="bubbleBekorchi" role="button" tabindex="0" title="20 yillik bekorchi !">
          <span class="speech-text">20 yillik bekorchi !</span>
        </div>

      </div>

      <!-- Right Bubble: "Qandaysiz bratim !" -->
      <div class="speech-box bubble-right" id="bubbleBratim" role="button" tabindex="0" title="Qandaysiz bratim !">
        <span class="speech-text">Qandaysiz bratim !</span>
      </div>

    </div>
  </main>

  <script src="js/mansur.js?v=6"></script>
</body>
</html>
